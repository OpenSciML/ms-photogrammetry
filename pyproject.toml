[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ms-photogrammetry"
version = "0.2.0"
description = "From-scratch multispectral UAV photogrammetry & 3D point cloud pipeline (Pure Python stdlib + Custom C++17 Engine)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Henry Ruiz", email = "henry.ruiz@tamu.edu" },
]
keywords = [
    "photogrammetry",
    "multispectral",
    "uav",
    "drone",
    "orthomosaic",
    "point-cloud",
    "structure-from-motion",
    "bundle-adjustment",
    "multi-view-stereo",
    "digital-elevation-model",
    "canopy-height-model",
    "geotiff",
    "las",
    "micasense",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "typer>=0.27.3",
]

[project.urls]
Homepage = "https://github.com/haruiz/ms-photogrammetry"
Repository = "https://github.com/haruiz/ms-photogrammetry"
Documentation = "https://github.com/haruiz/ms-photogrammetry#readme"
Issues = "https://github.com/haruiz/ms-photogrammetry/issues"

[project.scripts]
ms-photogrammetry = "ms_photogrammetry.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ms_photogrammetry"]
artifacts = [
    "src/ms_photogrammetry/cpp/*.cpp",
    "src/ms_photogrammetry/py.typed",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/ms_photogrammetry/**",
    "tests/**",
    "README.md",
    "TECHNICAL_REPORT.md",
    "LICENSE",
    "pyproject.toml",
]
